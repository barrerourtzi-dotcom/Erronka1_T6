# GitHub Pages konfigurazioa
title: "1. Erronka: T6 taldea"
description: "Core enpresaren azpiegituraren dokumentazioa"
lang: eu
baseurl: "/Erronka1_T6"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
